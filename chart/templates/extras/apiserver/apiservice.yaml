{{/*
  AUTO-GENERATED by hack/update-apiserver-templates.sh from
  gitops-promoter config/apiserver/. DO NOT EDIT MANUALLY; re-run the generator.
*/}}
{{- if .Values.apiserver.enabled }}
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.view.promoter.argoproj.io
  labels:
    app.kubernetes.io/name: apiservice
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  {{- if eq .Values.apiserver.certs.mode "cert-manager" }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ .Values.apiserver.certs.secretName }}
  {{- end }}
spec:
  group: view.promoter.argoproj.io
  version: v1alpha1
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "promoter.resourceName" (dict "suffix" "apiserver" "context" $) }}
    namespace: {{ .Release.Namespace }}
    port: 443
  {{- if eq .Values.apiserver.certs.mode "insecure" }}
  insecureSkipTLSVerify: true
  {{- else if eq .Values.apiserver.certs.mode "manual" }}
  caBundle: {{ .Values.apiserver.certs.caBundle | quote }}
  {{- end }}
{{- end }}
