{{- if .Values.apiserver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: service
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  selector:
    app.kubernetes.io/component: dashboard-apiserver
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
{{- end }}
