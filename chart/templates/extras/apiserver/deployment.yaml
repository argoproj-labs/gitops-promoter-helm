{{/*
  AUTO-GENERATED by hack/update-apiserver-templates.sh from
  gitops-promoter config/apiserver/. DO NOT EDIT MANUALLY; re-run the generator.
*/}}
{{- if .Values.apiserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: deployment
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: dashboard-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dashboard-apiserver
    spec:
      securityContext:
        {{- toYaml .Values.apiserver.podSecurityContext | nindent 8 }}
      containers:
        - name: apiserver
          image: {{ include "promoter.apiserver.image" . }}
          imagePullPolicy: {{ (.Values.apiserver.image).pullPolicy | default .Values.manager.image.pullPolicy }}
          command:
            - /usr/bin/tini
            - "--"
            - /gitops-promoter
            - apiserver
          args:
            - --secure-port=6443
            {{- if eq .Values.apiserver.certs.mode "insecure" }}
            - --cert-dir=/tmp/apiserver-certs
            {{- else }}
            - --tls-cert-file=/serving-certs/tls.crt
            - --tls-private-key-file=/serving-certs/tls.key
            {{- end }}
          ports:
            - name: https
              containerPort: 6443
              protocol: TCP
          securityContext:
            {{- toYaml .Values.apiserver.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if ne .Values.apiserver.certs.mode "insecure" }}
            - name: serving-cert
              mountPath: /serving-certs
              readOnly: true
            {{- end }}
      serviceAccountName: {{ include "promoter.resourceName" (dict "suffix" "apiserver" "context" $) }}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if ne .Values.apiserver.certs.mode "insecure" }}
        - name: serving-cert
          secret:
            secretName: {{ .Values.apiserver.certs.secretName }}
        {{- end }}
{{- end }}
