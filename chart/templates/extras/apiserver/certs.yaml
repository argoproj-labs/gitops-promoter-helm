{{/*
  AUTO-GENERATED by hack/update-apiserver-templates.sh from
  gitops-promoter config/apiserver/. DO NOT EDIT MANUALLY; re-run the generator.
*/}}
{{- if and .Values.apiserver.enabled (eq .Values.apiserver.certs.mode "cert-manager") }}
{{- if .Values.apiserver.certs.certManager.issuer.create }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-selfsigned" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.apiserver.certs.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
spec:
  secretName: {{ .Values.apiserver.certs.secretName }}
  dnsNames:
    - {{ include "promoter.resourceName" (dict "suffix" "apiserver" "context" $) }}.{{ .Release.Namespace }}.svc
    - {{ include "promoter.resourceName" (dict "suffix" "apiserver" "context" $) }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ if .Values.apiserver.certs.certManager.issuer.name }}{{ .Values.apiserver.certs.certManager.issuer.name }}{{ else }}{{ include "promoter.resourceName" (dict "suffix" "apiserver-selfsigned" "context" $) }}{{ end }}
    kind: {{ .Values.apiserver.certs.certManager.issuer.kind }}
    group: cert-manager.io
{{- end }}
