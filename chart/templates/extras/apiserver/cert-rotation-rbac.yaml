{{- if and .Values.apiserver.enabled (eq .Values.apiserver.certs.mode "builtin") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-cert-rotation" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.apiserver.certs.secretName }}
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-cert-rotation" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-cert-rotation" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "promoter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-cert-rotation" "context" $) }}
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
rules:
  - apiGroups:
      - apiregistration.k8s.io
    resources:
      - apiservices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiregistration.k8s.io
    resources:
      - apiservices
    resourceNames:
      - v1alpha1.view.promoter.argoproj.io
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-cert-rotation" "context" $) }}
  labels:
    app.kubernetes.io/component: dashboard-apiserver
    app.kubernetes.io/part-of: promoter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "promoter.resourceName" (dict "suffix" "apiserver-cert-rotation" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "promoter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
