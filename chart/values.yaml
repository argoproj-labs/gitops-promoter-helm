## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Replica count for the controller-manager Deployment (default 1).
  replicas: 1

  image:
    repository: quay.io/argoprojlabs/gitops-promoter
    tag: v0.36.0
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env: []

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: manager
            topologyKey: kubernetes.io/hostname
          weight: 100
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: deployment
            topologyKey: kubernetes.io/hostname
          weight: 5

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Service account for the controller manager
##
serviceAccount:
  enable: true

## RBAC (Kubebuilder helm/v2-alpha layout; replaces legacy rbacHelpers)
##
rbac:
  namespaced: false
  helpers:
    # Install convenience admin/editor/viewer roles for CRDs
    enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # When true, metrics are served via kube-rbac-proxy (HTTPS on the metrics Service).
  secure: true
  # Metrics server port
  port: 8080

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

# BEGIN controllerConfiguration
# Synced from upstream gitops-promoter config/config/controllerconfiguration.yaml
# (do not edit manually; run hack/update-controllerconfiguration.sh)
controllerConfiguration:
  promotionStrategy:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  changeTransferPolicy:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  pullRequest:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
    template:
      title: "Promote {{ with .ChangeTransferPolicy.Spec.ActivePath }}`{{ . }}` {{ end }}({{ trunc 5 .ChangeTransferPolicy.Status.Proposed.Dry.Sha }}) to `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`"
      description: "This PR is promoting {{ with .ChangeTransferPolicy.Spec.ActivePath }}`{{ . }}` on {{ end }}the environment branch `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}` from dry sha {{ .ChangeTransferPolicy.Status.Active.Dry.Sha }} to {{ .ChangeTransferPolicy.Status.Proposed.Dry.Sha }}."
  commitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  argocdCommitStatus:
    watchLocalApplications: true
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  timedCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  gitCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  webRequestCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  scheduledCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
# END controllerConfiguration

webhook:
  enable: true

## Dashboard aggregation apiserver (extension API server backing the GitOps Promoter UI).
## Serves the read-only view.promoter.argoproj.io/v1alpha1 PromotionStrategyDetails API
## through the Kubernetes aggregation layer. Opt-in; requires a gitops-promoter version
## that ships the `apiserver` subcommand.
##
apiserver:
  ## Enable the dashboard aggregation apiserver (APIService + Deployment + RBAC).
  enabled: false

  ## Replica count for the apiserver Deployment.
  replicas: 1

  ## Image override. Defaults to the manager image (the apiserver and controller share a
  ## single image). Set repository/tag/pullPolicy to override.
  image: {}
    # repository: quay.io/argoprojlabs/gitops-promoter
    # tag: ""
    # pullPolicy: IfNotPresent

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  ## Serving certificate configuration for the aggregation API.
  ##
  certs:
    ## How the apiserver's serving certificate and the APIService caBundle are managed:
    ##   insecure     - the apiserver self-signs in-pod and the APIService sets
    ##                  insecureSkipTLSVerify (no Secret rendered; NOT production-safe).
    ##   cert-manager - a cert-manager Issuer + Certificate issue the serving cert and
    ##                  ca-injector keeps the APIService caBundle in sync.
    ##   manual       - you supply the serving-cert Secret out-of-band and set caBundle below.
    mode: insecure

    ## Name of the serving-cert Secret (mounted in cert-manager/manual modes; unused in insecure).
    secretName: promoter-apiserver-serving-cert

    ## Base64-encoded CA bundle injected into the APIService (manual mode only).
    caBundle: ""

    ## cert-manager mode settings.
    certManager:
      issuer:
        ## Create a self-signed Issuer for the serving Certificate.
        create: true
        ## Use an existing issuer instead (leave empty to use the created one).
        name: ""
        ## Issuer kind: Issuer or ClusterIssuer.
        kind: Issuer
