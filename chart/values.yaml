## String to partially override chart.fullname template (will maintain the release name)
##
nameOverride: ""

## String to fully override chart.fullname template
##
fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip rendering the controller-manager Deployment.
  enabled: true

  ## Replica count for the controller-manager Deployment (default 1).
  replicas: 1

  image:
    repository: quay.io/argoprojlabs/gitops-promoter
    tag: v0.46.0
    # @schema
    # enum: [Always, IfNotPresent, Never]
    # @schema
    pullPolicy: IfNotPresent

  ## Labels and annotations for the Deployment object
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  labels: {}
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  annotations: {}

  ## Labels and annotations for the manager pods
  ##
  pod:
    # @schema
    # type: object
    # properties: {}
    # additionalProperties: true
    # @schema
    labels: {}
    # @schema
    # type: object
    # properties: {}
    # additionalProperties: true
    # @schema
    annotations: {}

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Environment variables
  ##
  env: []

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  ## Resource limits and requests
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: manager
            topologyKey: kubernetes.io/hostname
          weight: 100
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: deployment
            topologyKey: kubernetes.io/hostname
          weight: 5

  ## Manager pod's node selector
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Manager pod's topology spread constraints
  ##
  topologySpreadConstraints: []

  ## Manager pod's priority class
  ##
  priorityClassName: ""

  ## Manager pod's termination grace period in seconds (Kubernetes default when unset)
  ##
  # @schema
  # type: [integer, "null"]
  # @schema
  terminationGracePeriodSeconds: null

  ## Deployment update strategy
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  strategy: {}

## Service account for the controller manager
##
serviceAccount:
  enable: true
  ## Service account name (defaults to the chart's generated name)
  name: ""
  ## Labels and annotations for the ServiceAccount
  ##
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  labels: {}
  # @schema
  # type: object
  # properties: {}
  # additionalProperties: true
  # @schema
  annotations: {}

## RBAC (Kubebuilder helm/v2-alpha layout; replaces legacy rbacHelpers)
##
rbac:
  namespaced: false
  helpers:
    # Install convenience admin/editor/viewer roles for CRDs
    enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # When true, metrics are served via kube-rbac-proxy (HTTPS on the metrics Service).
  secure: true
  # Metrics server port
  port: 8080
  # kube-rbac-proxy sidecar image override. Defaults to the image shipped with the upstream
  # manifests; set repository/tag to use a mirror. A repository containing '@' (digest) ignores tag.
  # Pulled with manager.imagePullSecrets (same pod); list one secret per registry.
  kubeRbacProxy:
    # @schema
    # properties:
    #   repository: {type: string}
    #   tag: {type: string}
    # @schema
    image: {}
      # repository: quay.io/brancz/kube-rbac-proxy
      # tag: v0.23.1

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

# BEGIN controllerConfiguration
# Synced from upstream gitops-promoter config/config/controllerconfiguration.yaml
# (do not edit manually; run hack/update-controllerconfiguration.sh)
# @schema
# $ref: ../.values-schema/controllerconfiguration-spec.schema.json
# @schema
controllerConfiguration:
  promotionStrategy:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  changeTransferPolicyHistory:
    workQueue:
      maxConcurrentReconciles: 5
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  changeTransferPolicy:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  pullRequest:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
    template:
      title: "Promote {{ with .ChangeTransferPolicy.Spec.ActivePath }}`{{ . }}` {{ end }}({{ trunc 5 .ChangeTransferPolicy.Status.Proposed.Dry.Sha }}) to `{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`"
      description: |
        This PR promotes changes to **`{{ .ChangeTransferPolicy.Spec.ActiveBranch }}`**{{ if .PromotionStrategy }} (PromotionStrategy `{{ .PromotionStrategy.Name }}`){{ end }}.

        ### Deployment commit

        | | Active (deployed) | Proposed |
        |---|---|---|
        | SHA | {{ with .ChangeTransferPolicy.Status.Active.Dry }}{{ if and .RepoURL .Sha }}[{{ trunc 7 .Sha }}]({{ trimSuffix "/" .RepoURL }}/commit/{{ .Sha }}){{ else }}{{ trunc 7 .Sha }}{{ end }}{{ end }} | {{ with .ChangeTransferPolicy.Status.Proposed.Dry }}{{ if and .RepoURL .Sha }}[{{ trunc 7 .Sha }}]({{ trimSuffix "/" .RepoURL }}/commit/{{ .Sha }}){{ else }}{{ trunc 7 .Sha }}{{ end }}{{ end }} |
        | Subject | {{ replace "|" "\\|" .ChangeTransferPolicy.Status.Active.Dry.Subject }} | {{ replace "|" "\\|" .ChangeTransferPolicy.Status.Proposed.Dry.Subject }} |

        {{- $repo := "" -}}
        {{- $base := "" -}}
        {{- $head := "" -}}
        {{- $activeSubject := "" -}}
        {{- $proposedSubject := "" -}}
        {{- with .ChangeTransferPolicy.Status.Active.Dry.References }}{{- with index . 0 }}{{- with .Commit -}}
        {{- $base = .Sha -}}{{- $activeSubject = .Subject -}}{{- if .RepoURL -}}{{- $repo = .RepoURL -}}{{- end -}}
        {{- end -}}{{- end -}}{{- end -}}
        {{- with .ChangeTransferPolicy.Status.Proposed.Dry.References }}{{- with index . 0 }}{{- with .Commit -}}
        {{- $head = .Sha -}}{{- $proposedSubject = .Subject -}}{{- if and (not $repo) .RepoURL -}}{{- $repo = .RepoURL -}}{{- end -}}
        {{- end -}}{{- end -}}{{- end -}}
        {{- if or $base $head }}

        ### Code reference
        {{- if $base }}
        **Active:** {{ if and $repo $base }}[{{ trunc 7 $base }}]({{ trimSuffix "/" $repo }}/commit/{{ $base }}){{ else }}{{ trunc 7 $base }}{{ end }} — {{ $activeSubject }}
        {{- end }}
        {{- if $head }}
        **Proposed:** {{ if and $repo $head }}[{{ trunc 7 $head }}]({{ trimSuffix "/" $repo }}/commit/{{ $head }}){{ else }}{{ trunc 7 $head }}{{ end }} — {{ $proposedSubject }}
        {{- end }}
        {{- if and $repo $base $head }}
        **Diff:** [{{ trunc 7 $base }}...{{ trunc 7 $head }}]({{ trimSuffix "/" $repo }}/compare/{{ $base }}...{{ $head }})
        {{- end }}
        {{- end }}

        {{- with .PromotionStrategy }}
        {{- if .Status.Environments }}

        ### Promotion pipeline

        | Environment | Active dry | Proposed dry | PR |
        |---|---|---|---|
        {{- range .Status.Environments }}
        | `{{ .Branch }}`{{ if eq .Branch $.ChangeTransferPolicy.Spec.ActiveBranch }} **(this PR)**{{ end }} | {{ trunc 7 .Active.Dry.Sha }} | {{ trunc 7 .Proposed.Dry.Sha }} | {{ with .PullRequest }}{{ if .Url }}[#{{ .ID }}]({{ .Url }}){{ else }}—{{ end }}{{ else }}—{{ end }} |
        {{- end }}
        {{- end }}
        {{- end }}
  commitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  argocdCommitStatus:
    watchLocalApplications: true
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  timedCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  gitCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  webRequestCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  dependentsSuccessfulCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  scheduledCommitStatus:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
  restoreActiveCommit:
    workQueue:
      maxConcurrentReconciles: 10
      requeueDuration: "5m"
      rateLimiter:
        maxOf:
          - bucket:
              qps: 10
              bucket: 100
          - fastSlow:
              fastDelay: "1s"
              slowDelay: "5m"
              maxFastAttempts: 3
