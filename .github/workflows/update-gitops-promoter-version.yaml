name: Update GitOps Promoter Version

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  KUBEBUILDER_VERSION: v4.14.0

jobs:
  update-version:
    name: Update GitOps Promoter to Latest Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.1
        with:
          path: current-repo

      - name: Get latest GitOps Promoter release
        id: get-latest-release
        run: |
          v="$(bash "${GITHUB_WORKSPACE}/current-repo/hack/fetch-promoter-latest-release.sh")"
          echo "latest_version=$v" >> "$GITHUB_OUTPUT"
          echo "Latest GitOps Promoter version: $v"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if update is needed
        id: check-update
        run: |
          bash "${GITHUB_WORKSPACE}/current-repo/hack/check-promoter-version-update-needed.sh" \
            --helm-repo "${GITHUB_WORKSPACE}/current-repo" \
            --version "${{ steps.get-latest-release.outputs.latest_version }}"

      - name: Checkout gitops-promoter at latest release
        if: steps.check-update.outputs.update_needed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: argoproj-labs/gitops-promoter
          ref: ${{ steps.get-latest-release.outputs.latest_version }}
          path: gitops-promoter

      - name: Apply promoter version to chart (hack)
        if: steps.check-update.outputs.update_needed == 'true'
        env:
          KUBEBUILDER_VERSION: ${{ env.KUBEBUILDER_VERSION }}
        run: |
          bash "${GITHUB_WORKSPACE}/current-repo/hack/apply-promoter-version-to-chart.sh" \
            --helm-repo "${GITHUB_WORKSPACE}/current-repo" \
            --gitops-promoter-repo "${GITHUB_WORKSPACE}/gitops-promoter" \
            --version "${{ steps.get-latest-release.outputs.latest_version }}"

      - name: Set Artifact Hub changes annotation from gitops-promoter release notes
        if: steps.check-update.outputs.update_needed == 'true'
        working-directory: current-repo
        run: |
          bash hack/update-artifacthub-changes.sh \
            --version "${{ steps.get-latest-release.outputs.latest_version }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}"

      - name: Create Pull Request
        if: steps.check-update.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0
        with:
          path: current-repo
          commit-message: "chore: update GitOps Promoter to ${{ steps.get-latest-release.outputs.latest_version }}"
          title: "chore: update GitOps Promoter to ${{ steps.get-latest-release.outputs.latest_version }}"
          signoff: true
          body: |
            This PR updates GitOps Promoter from v${{ steps.check-update.outputs.current_version }} to ${{ steps.get-latest-release.outputs.latest_version }}.

            **Changes:**
            - Updated manifests using kubebuilder (hack/apply-promoter-version-to-chart.sh)
            - Updated controllerConfiguration in chart/values.yaml from upstream (hack/update-controllerconfiguration.sh)
            - Regenerated the dashboard apiserver templates from upstream config/apiserver/ (hack/update-apiserver-templates.sh)
            - Updated appVersion in Chart.yaml
            - Updated gitops_promoter_version

            **Release Notes:** https://github.com/argoproj-labs/gitops-promoter/releases/tag/${{ steps.get-latest-release.outputs.latest_version }}
          branch: update-gitops-promoter-${{ steps.get-latest-release.outputs.latest_version }}
          delete-branch: true
