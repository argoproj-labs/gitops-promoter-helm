name: ci.yaml
on:
  push:
    branches:
      - main
      - feat/add_helm_chart
  pull_request:
    branches:
      - main

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.0

      - name: Lint Helm chart
        run: helm lint chart

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Install Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm install argocd argo/argo-cd --namespace argocd --create-namespace --wait --timeout 5m

      - name: Install Helm chart
        run: |
          helm install promoter ./chart --namespace promoter-system --create-namespace --timeout 1m
          kubectl apply -f extra/controllerconfiguration.yaml -n promoter-system


      - name: Verify installation
        run: |
          kubectl get pods -n promoter-system
          sleep 30
          kubectl get pods -n promoter-system
          helm list -n promoter-system
          kubectl get all -n promoter-system
          echo "=== All pod logs ==="
          for pod in $(kubectl get pods -n promoter-system -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for $pod ---"
            kubectl logs "$pod" -n promoter-system --all-containers=true || true
          done