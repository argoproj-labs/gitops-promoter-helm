name: ci.yaml
on:
  push:
    branches:
      - main
      - feat/add_helm_chart
  pull_request:
    branches:
      - main

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint chart

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Install Helm chart
        run:  helm install promoter ./chart --namespace promoter-system --create-namespace  --set crds.enabled=true


