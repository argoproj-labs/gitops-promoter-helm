          kind: ScmProvider
          metadata:
            name: example-scm-provider
          spec:
            secretRef:
              name: example-scm-provider-secret
            # You must specify either github, gitlab, forgejo, bitbucketCloud or azureDevops. Multiple are provided here as examples.
